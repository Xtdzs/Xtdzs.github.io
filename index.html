<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<!-- ===== SEO：title 由 content.js 的 site.title 覆盖；favicon 使用头像 ===== -->
<title>Jinliang Gao's Homepage</title>
<meta name="description" content="Academic personal homepage">
<link rel="canonical" href="">

<meta property="og:type" content="profile">
<meta property="og:title" content="Jinliang Gao's Homepage">
<meta property="og:description" content="Academic personal homepage">

<link rel="icon" href="assets/img/avatar.jpg" type="image/jpeg">
<link rel="stylesheet" href="assets/css/style.css">

<script>
  /* 提前应用主题，避免刷新闪烁（FOUC） */
  (function () {
    try {
      var t = localStorage.getItem('hp-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var l = localStorage.getItem('hp-lang');
      if (l) document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    } catch (e) {}
  })();
</script>
</head>

<body>
<a class="skip-link" href="#main" data-skip>Skip to content</a>

<!-- ============ 顶部导航 ============ -->
<header class="site-head" id="top">
  <div class="wrap head-inner">
    <a class="brand" href="#about">
      <span class="brand-name" id="brandName"></span>
      <span class="brand-sub" id="brandSub"></span>
    </a>

    <nav class="nav" id="nav" aria-label="Primary"></nav>

    <div class="head-actions">
      <button class="icon-btn" id="langBtn" type="button" aria-label="Switch language" title="Switch language">
        <span id="langBtnText">中文</span>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle theme"></button>
    </div>
  </div>
</header>

<main class="wrap" id="main">

  <!-- ============ 关于 / About ============ -->
  <section class="section" id="about" aria-labelledby="about-h">
    <div class="about-grid">
      <div class="about-avatar">
        <div class="avatar" id="avatar"></div>
      </div>
      <div class="about-main">
        <p class="eyebrow" id="about-eyebrow"></p>
        <h1 class="name" id="aboutName"></h1>
        <p class="role" id="aboutRole"></p>
        <ul class="meta-list" id="aboutMeta"></ul>
        <div class="link-row" id="aboutLinks"></div>
      </div>
    </div>
    <div class="prose" id="aboutBody"></div>
    <div class="interests" id="aboutInterests"></div>
  </section>

  <!-- ============ 动态 / News ============ -->
  <section class="section" id="news" aria-labelledby="news-h" hidden>
    <h2 class="section-title" id="news-h"></h2>
    <ul class="news-list" id="newsList"></ul>
  </section>

  <!-- ============ 论文 / Publications ============ -->
  <section class="section" id="publications" aria-labelledby="pub-h" hidden>
    <h2 class="section-title" id="pub-h"></h2>
    <div class="filter-row" id="pubFilter"></div>
    <ol class="pub-list" id="pubList"></ol>
  </section>

  <!-- ============ 项目 / Projects ============ -->
  <section class="section" id="projects" aria-labelledby="proj-h" hidden>
    <h2 class="section-title" id="proj-h"></h2>
    <div class="proj-list" id="projList"></div>
  </section>

  <!-- ============ 经历 / Experience ============ -->
  <section class="section" id="experience" aria-labelledby="exp-h" hidden>
    <h2 class="section-title" id="exp-h"></h2>
    <div id="expBody"></div>
  </section>

  <!-- ============ 荣誉与服务 / Honors & Service ============ -->
  <section class="section" id="service" aria-labelledby="svc-h" hidden>
    <h2 class="section-title" id="svc-h"></h2>
    <div id="svcBody"></div>
  </section>

  <!-- ============ 联系 / Contact ============ -->
  <section class="section" id="contact" aria-labelledby="ct-h" hidden>
    <h2 class="section-title" id="ct-h"></h2>
    <div class="prose" id="contactBody"></div>
  </section>

</main>

<footer class="site-foot">
  <div class="wrap foot-inner">
    <span id="footLeft"></span>
    <span class="foot-right">
      <a href="#top" id="footTop"></a>
    </span>
  </div>
</footer>

<noscript>
  <div class="wrap"><p style="padding:2rem 0">This page requires JavaScript. / 本页面需要启用 JavaScript 才能显示完整内容。</p></div>
</noscript>

<script src="assets/data/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
